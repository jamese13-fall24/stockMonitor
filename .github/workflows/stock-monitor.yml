name: Stock Monitor – Goro Nomoru Figure

on:
  # schedule:
  #   - cron: '0 * * * *'     # Every hour
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run stock checker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python check_stock.py

      - name: Commit state file
        run: |
          echo "--- stock_state.json contents ---"
          cat stock_state.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_state.json
          echo "--- git status ---"
          git status
          echo "--- git diff staged ---"
          git diff --staged
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stock state"
            git push
            echo "State committed and pushed."
          fi
